<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>
    <div>
        <h1>OUR LITTLE WEBSITE</h1>
    </div>

    <div class="photo-container">
        <div class="photo1">
            <div class="inside-photo">
                <!-- <img src="images/photo1.jpg" alt=""> -->
            </div>
            <div class="inside-photos">
                <img src="" alt="">
            </div>
        </div>

        <div class="photo2">
            <div class="inside-photo2">
                <img src="" alt="">
            </div>
        </div>
    </div>

    <div class="music-container">
        <div class="music-img">
            <img src="images/pahintulot.jpg" alt="">
        </div>
        <div class="music-info">
            <h3>Pahintulot</h3>
            <p>Shirebound and busking</p>

            <div class="play-btn">
                <button id="playBtn" type="button">▶</button>
            </div>
        </div>
    </div>

    <audio id="backgroundMusic" autoplay loop>
        <source src="audio/pahintulot.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById("backgroundMusic");
        const playBtn = document.getElementById("playBtn");

        playBtn.addEventListener("click", () => {

            if (music.paused) {
                music.play();
            } 
            else {
                music.pause();
            }
        });

        music.addEventListener("play", () => {
            playBtn.textContent = "||";
        });

        music.addEventListener("pause", () => {
            playBtn.textContent = "▶";
        });
    </script>
</body>
</html>
